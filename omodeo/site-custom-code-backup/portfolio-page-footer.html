<!-- HEADER HEIGHT -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const navbar = document.querySelector('.navbar-2');

    if (!navbar) return;

    const updateHeaderHeight = () => {
      const navbarHeight = navbar.offsetHeight;

      document.documentElement.style.setProperty('--header-height', `${navbarHeight}px`);
    };

    // Set saat pertama load
    updateHeaderHeight();

    // Update jika ukuran navbar berubah
    const resizeObserver = new ResizeObserver(updateHeaderHeight);
    resizeObserver.observe(navbar);

    // Fallback saat window resize
    window.addEventListener('resize', updateHeaderHeight);
  });
</script>

<!-- HERO PARALLAX -->
<script>
  /*
   Parallax bawaan Webflow (IX2) baru memasang posisi awal saat
   event scroll pertama, sehingga image hero loncat. Transform
   image dikunci lewat CSS (--hero-py) dan digerakkan GSAP dari 0%.
  */
  document.addEventListener('DOMContentLoaded', () => {
    const section = document.querySelector('.portfolio-hero');
    const image = section && section.querySelector('.image-content-hero');

    if (!image) return;

    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    gsap.registerPlugin(ScrollTrigger);

    // Image 115% tinggi wrapper: maksimal -12% agar bawah tidak terbuka.
    gsap.fromTo(
      image,
      { '--hero-py': '0%' },
      {
        '--hero-py': '-12%',
        ease: 'none',
        immediateRender: true,
        scrollTrigger: {
          trigger: section,
          start: 'top top',
          end: 'bottom top',
          scrub: 0.4,
          invalidateOnRefresh: true,
        },
      },
    );
  });
</script>

<!-- FILTER / SORT — refresh ScrollTrigger saat tinggi list berubah -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = document.querySelector('[fs-list-element="list"]');

    if (!list || typeof ResizeObserver === 'undefined') return;

    let timer;
    let lastHeight = list.offsetHeight;

    new ResizeObserver(() => {
      const height = list.offsetHeight;

      if (height === lastHeight) return;

      lastHeight = height;

      clearTimeout(timer);

      timer = setTimeout(() => {
        if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
      }, 500);
    }).observe(list);
  });
</script>
