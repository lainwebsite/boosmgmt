<!-- HEADER HEIGHT -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const navbar = document.querySelector('.navbar-2');

    if (!navbar) return;

    const updateHeaderHeight = () => {
      const navbarHeight = navbar.offsetHeight;

      document.documentElement.style.setProperty('--header-height', `${navbarHeight}px`);
    };

    // Set saat pertama load
    updateHeaderHeight();

    // Update jika ukuran navbar berubah
    const resizeObserver = new ResizeObserver(updateHeaderHeight);
    resizeObserver.observe(navbar);

    // Fallback saat window resize
    window.addEventListener('resize', updateHeaderHeight);
  });
</script>

<!-- HERO PARALLAX -->
<script>
  /*
   Parallax bawaan Webflow (IX2) baru memasang posisi awal saat
   event scroll pertama, sehingga image hero loncat. Transform
   image dikunci lewat CSS (--hero-py) dan digerakkan GSAP dari 0%.
  */
  document.addEventListener('DOMContentLoaded', () => {
    const section = document.querySelector('.portfolio-hero');
    const image = section && section.querySelector('.image-content-hero');

    if (!image) return;

    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    gsap.registerPlugin(ScrollTrigger);

    // Image 115% tinggi wrapper: maksimal -12% agar bawah tidak terbuka.
    gsap.fromTo(
      image,
      { '--hero-py': '0%' },
      {
        '--hero-py': '-12%',
        ease: 'none',
        immediateRender: true,
        scrollTrigger: {
          trigger: section,
          start: 'top top',
          end: 'bottom top',
          scrub: 0.4,
          invalidateOnRefresh: true,
        },
      },
    );
  });
</script>

<!-- FILTER / SORT — refresh ScrollTrigger saat tinggi list berubah -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = document.querySelector('[fs-list-element="list"]');

    if (!list || typeof ResizeObserver === 'undefined') return;

    let timer;
    let lastHeight = list.offsetHeight;

    new ResizeObserver(() => {
      const height = list.offsetHeight;

      if (height === lastHeight) return;

      lastHeight = height;

      clearTimeout(timer);

      timer = setTimeout(() => {
        if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
      }, 500);
    }).observe(list);
  });
</script>


<!-- PORTFOLIO FILTER SMOOTH 1.5.0 (crossfade + own parallax) (was registered script, inlined so it travels with the site) -->
<script>
(function () {
  var st = document.createElement('style');
  st.textContent =
    '.pf-grid .portfolio-card-item .image-content{position:absolute!important;top:0!important;left:0!important;width:100%!important;height:120%!important;margin:0!important;transform:translate3d(0,var(--py,0px),0)!important;object-fit:cover!important;will-change:transform}';
  document.head.appendChild(st);
  var gl = document.querySelector('[fs-list-element="list"]');
  if (gl) gl.classList.add('pf-grid');
})();
(function () {
  var wrap, list, snap, locked = false, lockT, settleT, cleanT;
  var EASE = 'cubic-bezier(.22,1,.36,1)';
  function find() {
    list = document.querySelector('[fs-list-element="list"]');
    wrap = list && (list.closest('[fs-list-element="wrapper"]') || list.parentElement);
    return !!wrap;
  }
  var ticking = false;
  function update() {
    ticking = false;
    if (!list) return;
    var vh = window.innerHeight;
    Array.prototype.forEach.call(list.querySelectorAll('.portfolio-card-item .image-content'), function (img) {
      var f = img.parentElement;
      if (!f) return;
      var r = f.getBoundingClientRect();
      var p = (vh - r.top) / (vh + r.height);
      p = p < 0 ? 0 : p > 1 ? 1 : p;
      img.style.setProperty('--py', (-p * 0.2 * r.height).toFixed(1) + 'px');
    });
  }
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }
  function nudge() {
    requestAnimationFrame(update);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  function reset(s) {
    if (s) s.remove();
    wrap.style.transition = '';
    wrap.style.height = '';
    wrap.style.position = '';
    list.style.transition = '';
    list.style.opacity = '';
    Array.prototype.forEach.call(list.children, function (c) {
      c.style.transition = '';
      c.style.opacity = '';
      c.style.transform = '';
    });
  }
  function lock() {
    try {
      if (!wrap && !find()) return;
      clearTimeout(lockT);
      clearTimeout(settleT);
      clearTimeout(cleanT);
      reset(snap);
      snap = null;
      var h0 = wrap.offsetHeight;
      wrap.style.transition = 'none';
      wrap.style.height = h0 + 'px';
      wrap.style.position = 'relative';
      snap = list.cloneNode(true);
      snap.removeAttribute('fs-list-element');
      snap.removeAttribute('id');
      snap.querySelectorAll('[fs-list-element]').forEach(function (e) { e.removeAttribute('fs-list-element'); });
      snap.setAttribute('aria-hidden', 'true');
      snap.style.cssText += ';position:absolute;top:' + list.offsetTop + 'px;left:' + list.offsetLeft + 'px;width:' + list.offsetWidth + 'px;margin:0;pointer-events:none;z-index:2;opacity:1;transition:none;will-change:opacity';
      wrap.appendChild(snap);
      list.style.transition = 'none';
      list.style.opacity = '0';
      locked = true;
      lockT = setTimeout(release, 1500);
    } catch (err) {
      locked = false;
    }
  }
  function release() {
    clearTimeout(lockT);
    if (!locked) return;
    locked = false;
    var h0 = parseFloat(wrap.style.height) || wrap.offsetHeight;
    wrap.style.height = 'auto';
    var h1 = wrap.offsetHeight;
    wrap.style.height = h0 + 'px';
    var items = Array.prototype.slice.call(list.children);
    items.forEach(function (c) {
      c.style.transition = 'none';
      c.style.opacity = '0';
      c.style.transform = 'translateY(18px)';
    });
    list.style.transition = 'none';
    list.style.opacity = '1';
    update();
    void wrap.offsetHeight;
    wrap.style.transition = 'height .7s ' + EASE;
    wrap.style.height = h1 + 'px';
    items.forEach(function (c, i) {
      var d = Math.min(i * 55, 440) + 'ms';
      c.style.transition = 'opacity .7s ease ' + d + ', transform .8s ' + EASE + ' ' + d;
      c.style.opacity = '1';
      c.style.transform = 'translateY(0)';
    });
    var s = snap;
    snap = null;
    if (s) { s.style.transition = 'opacity .45s ease'; s.style.opacity = '0'; }
    cleanT = setTimeout(function () {
      reset(s);
      nudge();
    }, 900 + Math.min(items.length * 55, 440));
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.closest && e.target.closest('[fs-list-element="filters"]')) lock();
  }, true);
  window.addEventListener('load', function () {
    if (!find()) return;
    update();
    new MutationObserver(function () {
      clearTimeout(settleT);
      settleT = setTimeout(function () {
        nudge();
        if (locked) setTimeout(release, 60);
        else setTimeout(nudge, 400);
      }, 160);
    }).observe(list, { childList: true });
  });
})();
</script>
