<script>
  (() => {
    const POSTER_URL = 'https://cdn.prod.website-files.com/67f610e9614020f62021d2f4/6a9a2c76833d25a03540b339_aabb04088b730836a3e21d62f1e4bf8cea3d65c6d93481c60d218cf60c70285f.webp';

    const state = {
      confirmed: false,
      host: null,
      poster: null,
      observer: null,
    };

    window.__BOSS_MEDIA_FALLBACK__ = state;

    function findHost() {
      return document.querySelector('.filler-media') || document.querySelector('.track-filler');
    }

    function forcePosterVisible(poster) {
      if (!poster || state.confirmed) {
        return;
      }

      poster.style.setProperty('display', 'block', 'important');

      poster.style.setProperty('position', 'absolute', 'important');

      poster.style.setProperty('inset', '0', 'important');

      poster.style.setProperty('z-index', '9999', 'important');

      poster.style.setProperty('width', '100%', 'important');

      poster.style.setProperty('height', '100%', 'important');

      poster.style.setProperty('min-width', '100%', 'important');

      poster.style.setProperty('min-height', '100%', 'important');

      poster.style.setProperty('max-width', 'none', 'important');

      poster.style.setProperty('object-fit', 'cover', 'important');

      poster.style.setProperty('object-position', 'center', 'important');

      poster.style.setProperty('opacity', '1', 'important');

      poster.style.setProperty('visibility', 'visible', 'important');

      poster.style.setProperty('pointer-events', 'none', 'important');
    }

    function ensureFallback() {
      if (state.confirmed) {
        return true;
      }

      const host = findHost();

      if (!host) {
        return false;
      }

      state.host = host;

      const position = getComputedStyle(host).position;

      if (position === 'static') {
        host.style.setProperty('position', 'relative', 'important');
      }

      host.style.setProperty('background-image', `url("${POSTER_URL}")`, 'important');

      host.style.setProperty('background-size', 'cover', 'important');

      host.style.setProperty('background-position', 'center', 'important');

      host.style.setProperty('background-repeat', 'no-repeat', 'important');

      let poster = host.querySelector('#boss-media-hard-poster');

      if (!poster) {
        poster = document.createElement('img');

        poster.id = 'boss-media-hard-poster';

        poster.alt = '';

        poster.setAttribute('aria-hidden', 'true');

        poster.setAttribute('loading', 'eager');

        poster.setAttribute('fetchpriority', 'high');

        poster.setAttribute('decoding', 'sync');

        forcePosterVisible(poster);

        host.insertBefore(poster, host.firstChild);

        poster.src = POSTER_URL;
      }

      state.poster = poster;

      forcePosterVisible(poster);

      return true;
    }

    window.BOSS_MEDIA_CONFIRM_READY = function () {
      if (state.confirmed) {
        return;
      }

      const host = state.host || findHost();

      const poster = state.poster || host?.querySelector('#boss-media-hard-poster');

      if (!host || !poster) {
        return;
      }

      state.confirmed = true;

      poster.style.setProperty('transition', 'opacity .4s ease', 'important');

      poster.style.setProperty('opacity', '0', 'important');

      setTimeout(() => {
        poster.style.setProperty('visibility', 'hidden', 'important');

        host.style.setProperty('background-image', 'none', 'important');
      }, 450);

      state.observer?.disconnect();
    };

    function start() {
      if (ensureFallback()) {
        return;
      }

      let attempts = 0;

      const timer = setInterval(() => {
        attempts++;

        if (ensureFallback() || attempts >= 120) {
          clearInterval(timer);
        }
      }, 50);
    }

    start();

    document.addEventListener('DOMContentLoaded', start, {
      once: true,
    });

    window.Webflow = window.Webflow || [];

    window.Webflow.push(start);

    if ('MutationObserver' in window) {
      state.observer = new MutationObserver(() => {
        if (!state.confirmed) {
          ensureFallback();
        }
      });

      state.observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    }
  })();
</script>

<script type="module">
  /* =========================================================
   IMPORT
========================================================= */

  import React, { Suspense, useEffect, useMemo, useRef, useState } from 'react';

  import { createRoot } from 'react-dom/client';

  import { Canvas, extend, useFrame } from '@react-three/fiber';

  import { useAspect, useTexture } from '@react-three/drei';

  import * as THREE from 'three/webgpu';

  import { clamp, dot, float, floor, fract, max, mix, oneMinus, sin, step, texture, uniform, uv, vec2, vec3 } from 'three/tsl';

  extend(THREE);

  /* =========================================================
   ASSETS
========================================================= */

  const VIDEO_MP4 = 'https://s3.amazonaws.com/webflow-prod-assets/67f610e9614020f62021d2f4/6a97d1fc5d6ac0d982b59544_Boss%20Filler.mp4';

  const VIDEO_WEBM = 'https://s3.amazonaws.com/webflow-prod-assets/67f610e9614020f62021d2f4/6a9a2b63eda74ea41f629217_Boss%20Filler.webm';

  const TILE_URL = 'https://cdn.prod.website-files.com/67f610e9614020f62021d2f4/6a44913dce7d87918a95ea64_b..svg';

  /* =========================================================
   SIZE
========================================================= */

  const WIDTH = 1226;

  const HEIGHT = 650;

  /* =========================================================
   SETTINGS
========================================================= */

  const TILE_DENSITY_DESKTOP = 40;

  const TILE_DENSITY_TABLET = 50;

  const TILE_DENSITY_MOBILE = 64;

  const TILE_SIZE_DESKTOP = 0.78;

  const TILE_SIZE_TABLET = 0.66;

  const TILE_SIZE_MOBILE = 0.55;

  const COLOR_LEVELS = 24;

  const REVEAL_STEPS = 64;

  const REVEAL_PORTION = 0.58;

  const HIDE_START = 0.76;

  const HIDE_DURATION = 0.24;

  const HIDE_TILE_TO_HIDE_DELAY = 0.22;

  /* =========================================================
   ENTRY

   Initial boost ONLY once the cards have left and
   .filler-media is held at the top.
========================================================= */

  const ENTRY_PROGRESS_DESKTOP = 0.055;

  const ENTRY_PROGRESS_TABLET = 0.04;

  const ENTRY_PROGRESS_MOBILE = 0.04;

  /* =========================================================
   START OFFSET

   Reveal starts while the last cards are still leaving:
   once every card is past this fraction of the viewport
   (width on desktop / tablet slide, height on mobile stack).
   0 = wait until the cards are fully gone, 0.5 = half way.
========================================================= */

  const START_OFFSET_X = 0.5;

  const START_OFFSET_Y = 0.35;

  const READY_FRAME_COUNT = 8;

  /* =========================================================
   HELPERS
========================================================= */

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  function isMobileKeyboardOpen() {
    if (!matchMedia('(max-width:767px)').matches) {
      return false;
    }

    const el = document.activeElement;

    if (!el) {
      return false;
    }

    return el.matches('input') || el.matches('textarea') || el.matches('select') || el.isContentEditable;
  }

  /* =========================================================
   SCROLLTRIGGER
========================================================= */

  async function getScrollTrigger(timeout = 30000) {
    const started = performance.now();

    while (!window.ScrollTrigger && performance.now() - started < timeout) {
      await sleep(50);
    }

    if (!window.ScrollTrigger) {
      throw new Error('ScrollTrigger unavailable');
    }

    try {
      window.gsap?.registerPlugin?.(window.ScrollTrigger);
    } catch (_) {}

    return window.ScrollTrigger;
  }

  /* =========================================================
   SAFE REFRESH
========================================================= */

  let refreshRAF1 = 0;

  let refreshRAF2 = 0;

  function safeRefresh() {
    if (isMobileKeyboardOpen()) {
      return;
    }

    const ScrollTrigger = window.ScrollTrigger;

    if (!ScrollTrigger) {
      return;
    }

    cancelAnimationFrame(refreshRAF1);

    cancelAnimationFrame(refreshRAF2);

    refreshRAF1 = requestAnimationFrame(() => {
      refreshRAF2 = requestAnimationFrame(() => {
        if (isMobileKeyboardOpen()) {
          return;
        }

        try {
          ScrollTrigger.refresh();
        } catch (_) {}
      });
    });
  }

  /* =========================================================
   SCENE
========================================================= */

  function Scene({ onReady, onError }) {
    const tileMap = useTexture(TILE_URL);

    const videoReadyRef = useRef(false);

    const renderedFramesRef = useRef(0);

    const readySentRef = useRef(false);

    /* =======================================================
     VIDEO
  ======================================================= */

    const video = useMemo(() => {
      const el = document.createElement('video');

      el.crossOrigin = 'anonymous';

      el.preload = 'auto';

      el.muted = true;

      el.defaultMuted = true;

      el.autoplay = true;

      el.loop = true;

      el.playsInline = true;

      el.disablePictureInPicture = true;

      el.setAttribute('muted', '');

      el.setAttribute('playsinline', '');

      el.setAttribute('webkit-playsinline', '');

      return el;
    }, []);

    /* =======================================================
     VIDEO TEXTURE
  ======================================================= */

    const videoMap = useMemo(() => {
      const map = new THREE.VideoTexture(video);

      map.colorSpace = THREE.SRGBColorSpace;

      map.wrapS = THREE.ClampToEdgeWrapping;

      map.wrapT = THREE.ClampToEdgeWrapping;

      map.minFilter = THREE.LinearFilter;

      map.magFilter = THREE.LinearFilter;

      map.generateMipmaps = false;

      return map;
    }, [video]);

    /* =======================================================
     VIDEO SOURCE
  ======================================================= */

    useEffect(() => {
      let destroyed = false;

      let confirmed = false;

      let videoFrameID = null;

      let sourceIndex = 0;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      const candidates = isIOS
        ? [
            {
              src: VIDEO_MP4,

              type: 'video/mp4',
            },

            {
              src: VIDEO_WEBM,

              type: 'video/webm',
            },
          ]
        : [
            {
              src: VIDEO_WEBM,

              type: 'video/webm',
            },

            {
              src: VIDEO_MP4,

              type: 'video/mp4',
            },
          ];

      const playable = candidates.filter((source) => {
        const result = video.canPlayType(source.type);

        return result === 'probably' || result === 'maybe';
      });

      const sources = playable.length ? playable : candidates;

      const tryPlay = () => {
        if (destroyed) {
          return;
        }

        try {
          video.play()?.catch?.(() => {});
        } catch (_) {}
      };

      const confirmVideo = () => {
        if (destroyed || confirmed) {
          return;
        }

        if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
          return;
        }

        confirmed = true;

        videoReadyRef.current = true;

        videoMap.needsUpdate = true;
      };

      const waitVideoFrame = () => {
        if (destroyed || confirmed) {
          return;
        }

        if ('requestVideoFrameCallback' in video) {
          videoFrameID = video.requestVideoFrameCallback(() => {
            confirmVideo();
          });
        } else {
          const check = () => {
            confirmVideo();

            if (!confirmed && !destroyed) {
              requestAnimationFrame(check);
            }
          };

          requestAnimationFrame(check);
        }
      };

      const loadSource = (index) => {
        if (destroyed || !sources[index]) {
          return;
        }

        sourceIndex = index;

        confirmed = false;

        videoReadyRef.current = false;

        renderedFramesRef.current = 0;

        video.src = sources[index].src;

        try {
          video.load();
        } catch (_) {}

        tryPlay();
      };

      const handleError = () => {
        if (destroyed) {
          return;
        }

        if (sourceIndex + 1 < sources.length) {
          loadSource(sourceIndex + 1);

          return;
        }

        onError?.(new Error('All BOSS video formats failed.'));
      };

      video.addEventListener('loadeddata', waitVideoFrame);

      video.addEventListener('canplay', waitVideoFrame);

      video.addEventListener('playing', waitVideoFrame);

      video.addEventListener('error', handleError);

      window.addEventListener('touchstart', tryPlay, {
        passive: true,
      });

      window.addEventListener('pointerdown', tryPlay, {
        passive: true,
      });

      loadSource(0);

      return () => {
        destroyed = true;

        video.removeEventListener('loadeddata', waitVideoFrame);

        video.removeEventListener('canplay', waitVideoFrame);

        video.removeEventListener('playing', waitVideoFrame);

        video.removeEventListener('error', handleError);

        window.removeEventListener('touchstart', tryPlay);

        window.removeEventListener('pointerdown', tryPlay);

        if (videoFrameID !== null && 'cancelVideoFrameCallback' in video) {
          try {
            video.cancelVideoFrameCallback(videoFrameID);
          } catch (_) {}
        }

        try {
          video.pause();
        } catch (_) {}

        video.removeAttribute('src');

        videoMap.dispose();
      };
    }, [video, videoMap, onError]);

    /* =======================================================
     TILE
  ======================================================= */

    tileMap.colorSpace = THREE.NoColorSpace;

    tileMap.wrapS = THREE.ClampToEdgeWrapping;

    tileMap.wrapT = THREE.ClampToEdgeWrapping;

    tileMap.generateMipmaps = false;

    tileMap.minFilter = THREE.LinearFilter;

    tileMap.magFilter = THREE.LinearFilter;

    /* =======================================================
     MATERIAL
  ======================================================= */

    const { material, uniforms } = useMemo(() => {
      const mobile = matchMedia('(max-width:767px)').matches;

      const tablet = matchMedia('(min-width:768px) and (max-width:991px)').matches;

      const density = mobile ? TILE_DENSITY_MOBILE : tablet ? TILE_DENSITY_TABLET : TILE_DENSITY_DESKTOP;

      const tileSize = mobile ? TILE_SIZE_MOBILE : tablet ? TILE_SIZE_TABLET : TILE_SIZE_DESKTOP;

      /* ===================================================
           IMPORTANT

           TRUE zero initial state.
        =================================================== */

      const uReveal = uniform(0);

      const uStarted = uniform(0);

      const uDensity = uniform(density);

      const aspect = float(WIDTH).div(HEIGHT);

      /* ===================================================
           VIDEO
        =================================================== */

      const cleanVideo = texture(videoMap, uv()).rgb;

      /* ===================================================
           GRID
        =================================================== */

      const correctedUV = vec2(uv().x.mul(aspect), uv().y);

      const gridUV = correctedUV.mul(uDensity);

      const cellID = floor(gridUV);

      const localUV = fract(gridUV);

      const pixelCorrected = cellID.add(0.5).div(uDensity);

      const pixelUV = vec2(pixelCorrected.x.div(aspect), pixelCorrected.y);

      const pixelSample = texture(videoMap, pixelUV).rgb;

      const pixelColor = floor(pixelSample.mul(float(COLOR_LEVELS - 1))).div(float(COLOR_LEVELS - 1));

      const pixelLuma = pixelColor.r.mul(0.299).add(pixelColor.g.mul(0.587)).add(pixelColor.b.mul(0.114));

      /* ===================================================
           PIXEL B
        =================================================== */

      const tileUV = localUV.sub(0.5).div(float(tileSize)).add(0.5);

      const inside = step(0, tileUV.x)
        .mul(oneMinus(step(1, tileUV.x)))
        .mul(step(0, tileUV.y))
        .mul(oneMinus(step(1, tileUV.y)));

      const tileSample = texture(tileMap, tileUV);

      const tileLuma = tileSample.r.mul(0.299).add(tileSample.g.mul(0.587)).add(tileSample.b.mul(0.114));

      const tileAlpha = step(0.1, tileSample.a);

      const bright = step(0.55, tileLuma).mul(tileAlpha);

      const dark = oneMinus(step(0.45, tileLuma)).mul(tileAlpha);

      const shape = max(bright, dark).mul(inside);

      const baseColor = pixelColor.mul(0.58);

      const brightness = floor(clamp(pixelLuma.mul(1.45).add(0.14), 0, 1).mul(8)).div(8);

      const logoColor = mix(baseColor, vec3(brightness), shape);

      /* ===================================================
           ORIGINAL RANDOM + DIAGONAL

           IMPORTANT:
           DO NOT CHANGE THIS.

           top-left -> bottom-right
        =================================================== */

      const random = fract(sin(dot(cellID, vec2(12.9898, 78.233))).mul(43758.5453));

      const diagonal = pixelUV.x.mul(0.5).add(oneMinus(pixelUV.y).mul(0.5));

      const order = diagonal.mul(0.92).add(random.mul(0.08));

      /* ===================================================
           REVEAL
        =================================================== */

      const revealRaw = clamp(uReveal.div(REVEAL_PORTION), 0, 1);

      const steppedReveal = floor(revealRaw.mul(float(REVEAL_STEPS))).div(float(REVEAL_STEPS));

      const visibleIn = step(order, steppedReveal.mul(1.16)).mul(uStarted);

      /* ===================================================
           PIXEL -> CLEAN
        =================================================== */

      const cleanRaw = clamp(steppedReveal.sub(0.18).div(0.82), 0, 1);

      const cleanProgress = floor(cleanRaw.mul(float(REVEAL_STEPS))).div(float(REVEAL_STEPS));

      const cleanSwitch = step(order, cleanProgress.mul(1.14));

      const transition = mix(logoColor, cleanVideo, cleanSwitch);

      /* ===================================================
           HIDE
           SAME DIAGONAL
        =================================================== */

      const hideOrder = diagonal.mul(0.92).add(random.mul(0.08));

      const hideRaw = clamp(uReveal.sub(HIDE_START).div(HIDE_DURATION), 0, 1);

      const steppedHide = floor(hideRaw.mul(float(REVEAL_STEPS))).div(float(REVEAL_STEPS));

      const hideSwitch = step(hideOrder, steppedHide.mul(1.12));

      const hideColor = mix(transition, logoColor, hideSwitch);

      const hideVisibilityRaw = clamp(hideRaw.sub(HIDE_TILE_TO_HIDE_DELAY).div(1 - HIDE_TILE_TO_HIDE_DELAY), 0, 1);

      const hideVisibility = floor(hideVisibilityRaw.mul(float(REVEAL_STEPS))).div(float(REVEAL_STEPS));

      const hideMask = step(hideOrder, hideVisibility.mul(1.12));

      const finalVisibility = visibleIn.mul(oneMinus(hideMask));

      /* ===================================================
           MATERIAL
        =================================================== */

      const material = new THREE.MeshBasicNodeMaterial();

      material.colorNode = hideColor;

      material.opacityNode = finalVisibility;

      material.transparent = true;

      material.depthWrite = false;

      material.depthTest = false;

      return {
        material,

        uniforms: {
          uReveal,
          uStarted,
        },
      };
    }, [videoMap, tileMap]);

    const [w, h] = useAspect(WIDTH, HEIGHT);

    /* =======================================================
     SCROLL

     Reveal starts once every .www-card-item is past the
     START_OFFSET line. If .track-filler has not reached the top
     yet, .filler-media is held at top:0 with a transform
     (visual sticky) until real CSS sticky takes over, so the
     reveal always runs on a stuck frame and never on a
     blank screen.
  ======================================================= */

    useEffect(() => {
      let destroyed = false;

      let cleanup = null;

      async function initScroll() {
        try {
          await getScrollTrigger().catch(() => null);

          if (destroyed) {
            return;
          }

          const container = document.getElementById('webgpu-canvas');

          if (!container) {
            return;
          }

          const track = container.closest('.track-filler') || container.closest('.section-fiiler') || container;

          const media = container.closest('.filler-media') || container;

          const cardsSection = document.querySelector('.who-we-work-section');

          const cards = Array.from(document.querySelectorAll('.who-we-work-section .www-card-item'));

          /* =================================================
             GEOMETRY (document coordinates)

             Measured every frame: late images / fonts can
             shift the layout after init.
          ================================================= */

          const measure = (scrollY) => {
            const viewport = window.innerHeight;

            const top = track.getBoundingClientRect().top + scrollY;

            /* Scroll range while .filler-media stays stuck */
            const stickyDistance = Math.max(0, track.offsetHeight - (media.offsetHeight || viewport));

            const span = Math.max(viewport * 0.5, stickyDistance * 0.88);

            return {
              top,

              /* Designed reveal -> hide length */
              span,

              /* Hide must still finish here (original end) */
              end: top + span,
            };
          };

          /* Cards count as leaving once all of them are past the
             START_OFFSET line: towards the right edge (desktop
             horizontal slide) or the top (tablet / mobile stack).
             Cards still below or left have not played yet. */
          const cardsGone = () => {
            if (!cards.length || !cardsSection) {
              return track.getBoundingClientRect().top <= 0;
            }

            /* Not reached the cards section yet */
            if (cardsSection.getBoundingClientRect().top > 0) {
              return false;
            }

            const lineX = window.innerWidth * START_OFFSET_X;

            const lineY = window.innerHeight * START_OFFSET_Y;

            return cards.every((card) => {
              const r = card.getBoundingClientRect();

              return r.left >= lineX || r.bottom <= lineY;
            });
          };

          /* =================================================
             PROGRESS

             Direction shader NEVER changes.
             We only shift the entry progress.
          ================================================= */

          const setReveal = (progress) => {
            const realProgress = Math.min(1, Math.max(0, progress));

            const mobile = matchMedia('(max-width:767px)').matches;

            const tablet = matchMedia('(min-width:768px) and (max-width:991px)').matches;

            const entryProgress = mobile ? ENTRY_PROGRESS_MOBILE : tablet ? ENTRY_PROGRESS_TABLET : ENTRY_PROGRESS_DESKTOP;

            uniforms.uStarted.value = 1;

            uniforms.uReveal.value = Math.min(1, entryProgress + realProgress * (1 - entryProgress));
          };

          /* Reveal and hide keep the designed pace (span). When
             the run from the start point to the original end is
             longer than span, the extra distance holds the clean
             video between REVEAL_PORTION and HIDE_START, so the
             hide still lands at the original end. */
          const mapProgress = (distance, span, total) => {
            span = Math.max(1, span);

            if (total <= span) {
              return distance / Math.max(1, total);
            }

            const revealEnd = span * REVEAL_PORTION;

            const holdEnd = revealEnd + span * (HIDE_START - REVEAL_PORTION) + (total - span);

            if (distance <= revealEnd) {
              return distance / span;
            }

            if (distance <= holdEnd) {
              return REVEAL_PORTION + ((distance - revealEnd) / (holdEnd - revealEnd)) * (HIDE_START - REVEAL_PORTION);
            }

            return HIDE_START + (distance - holdEnd) / span;
          };

          const resetReveal = () => {
            uniforms.uStarted.value = 0;

            uniforms.uReveal.value = 0;
          };

          /* =================================================
             HOLD .filler-media AT TOP UNTIL CSS STICKY
          ================================================= */

          let holding = false;

          const setHold = (offset) => {
            if (offset < -0.5) {
              media.style.setProperty('transform', `translate3d(0, ${offset}px, 0)`);

              holding = true;
            } else if (holding) {
              media.style.removeProperty('transform');

              holding = false;
            }
          };

          /* =================================================
             TICK

             Runs every frame (not only on scroll): IX2 card
             smoothing keeps moving the cards after the wheel
             stops.
          ================================================= */

          let startY = null;

          let raf = 0;

          const tick = () => {
            raf = requestAnimationFrame(tick);

            if (destroyed || document.hidden) {
              return;
            }

            const scrollY = window.scrollY;

            const geo = measure(scrollY);

            const gone = cardsGone();

            if (!gone) {
              setHold(0);

              resetReveal();

              return;
            }

            /* Record where the cards left. Loaded deep in the
               page: fall back to the natural sticky point. */
            if (startY === null) {
              startY = Math.min(scrollY, geo.top);
            }

            /* Above the recorded exit point: stay blank */
            if (scrollY < startY) {
              setHold(0);

              resetReveal();

              return;
            }

            setHold(Math.min(0, scrollY - geo.top));

            setReveal(mapProgress(scrollY - startY, geo.span, geo.end - startY));
          };

          /* =================================================
             START LOOP
          ================================================= */

          tick();

          /* =================================================
             RESIZE / REFRESH
          ================================================= */

          let resizeTimer = 0;

          const refresh = () => {
            if (destroyed || isMobileKeyboardOpen()) {
              return;
            }

            clearTimeout(resizeTimer);

            resizeTimer = setTimeout(() => {
              setHold(0);

              startY = null;
            }, 120);
          };

          let observer = null;

          if ('ResizeObserver' in window) {
            observer = new ResizeObserver(refresh);

            observer.observe(track);
          }

          window.addEventListener('resize', refresh, {
            passive: true,
          });

          window.addEventListener('orientationchange', refresh, {
            passive: true,
          });

          cleanup = () => {
            clearTimeout(resizeTimer);

            cancelAnimationFrame(raf);

            observer?.disconnect();

            window.removeEventListener('resize', refresh);

            window.removeEventListener('orientationchange', refresh);

            setHold(0);
          };
        } catch (error) {
          console.warn('[BOSS] Scroll controller failed:', error);
        }
      }

      initScroll();

      return () => {
        destroyed = true;

        cleanup?.();
      };
    }, [uniforms.uReveal, uniforms.uStarted]);

    /* =======================================================
     READY
  ======================================================= */

    useFrame(() => {
      if (readySentRef.current) {
        return;
      }

      if (!videoReadyRef.current) {
        renderedFramesRef.current = 0;

        return;
      }

      renderedFramesRef.current++;

      if (renderedFramesRef.current < READY_FRAME_COUNT) {
        return;
      }

      readySentRef.current = true;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          onReady?.();
        });
      });
    });

    return React.createElement(
      'mesh',

      {
        scale: [w, h, 1],

        material,

        frustumCulled: false,
      },

      React.createElement('planeGeometry', {
        args: [1, 1],
      }),
    );
  }

  /* =========================================================
   ERROR BOUNDARY
========================================================= */

  class BossBoundary extends React.Component {
    constructor(props) {
      super(props);

      this.state = {
        failed: false,
      };
    }

    static getDerivedStateFromError() {
      return {
        failed: true,
      };
    }

    componentDidCatch(error) {
      this.props.onError?.(error);
    }

    render() {
      return this.state.failed ? null : this.props.children;
    }
  }

  /* =========================================================
   APP
========================================================= */

  function App({ onReady, onError }) {
    const [ready, setReady] = useState(false);

    const [visible, setVisible] = useState(true);

    useEffect(() => {
      const target = document.getElementById('webgpu-canvas');

      if (!target || !('IntersectionObserver' in window)) {
        return;
      }

      const observer = new IntersectionObserver(
        ([entry]) => {
          setVisible(entry.isIntersecting);
        },
        {
          rootMargin: '350px 0px',
        },
      );

      observer.observe(target);

      return () => observer.disconnect();
    }, []);

    const actualReady = () => {
      setReady(true);

      onReady?.();
    };

    const dpr = matchMedia('(max-width:767px)').matches ? 1 : 1.25;

    return React.createElement(
      BossBoundary,

      {
        onError,
      },

      React.createElement(
        Canvas,

        {
          style: {
            width: '100%',

            height: '100%',

            background: 'transparent',
          },

          dpr: [1, dpr],

          frameloop: ready && !visible ? 'never' : 'always',

          camera: {
            position: [0, 0, 5],

            fov: 50,
          },

          gl: async (props) => {
            try {
              const renderer = new THREE.WebGPURenderer({
                ...props,

                antialias: false,

                alpha: true,

                forceWebGL: true,
              });

              await renderer.init();

              renderer.setClearColor(0x000000, 0);

              renderer.setClearAlpha(0);

              return renderer;
            } catch (error) {
              onError?.(error);

              throw error;
            }
          },
        },

        React.createElement(
          Suspense,

          {
            fallback: null,
          },

          React.createElement(
            Scene,

            {
              onReady: actualReady,

              onError,
            },
          ),
        ),
      ),
    );
  }

  /* =========================================================
   PRELOAD TILE
========================================================= */

  useTexture.preload(TILE_URL);

  /* =========================================================
   BOOT
========================================================= */

  let booting = false;

  let booted = false;

  function bootBossMedia() {
    if (booting || booted) {
      return;
    }

    const rootElement = document.getElementById('webgpu-canvas');

    if (!rootElement) {
      console.warn('[BOSS] #webgpu-canvas missing.');

      return;
    }

    booting = true;

    if (rootElement.__bossReactRoot) {
      try {
        rootElement.__bossReactRoot.unmount();
      } catch (_) {}

      rootElement.__bossReactRoot = null;
    }

    rootElement.innerHTML = '';

    let root;

    try {
      root = createRoot(rootElement);

      rootElement.__bossReactRoot = root;
    } catch (error) {
      booting = false;

      return;
    }

    let confirmed = false;

    const handleReady = () => {
      if (confirmed) {
        return;
      }

      confirmed = true;

      booting = false;

      booted = true;

      window.BOSS_MEDIA_CONFIRM_READY?.();

      safeRefresh();

      setTimeout(safeRefresh, 250);

      setTimeout(safeRefresh, 900);
    };

    const handleError = (error) => {
      console.warn('[BOSS] Renderer/video error. Poster remains visible.', error);
    };

    try {
      root.render(
        React.createElement(
          App,

          {
            onReady: handleReady,

            onError: handleError,
          },
        ),
      );
    } catch (error) {
      handleError(error);
    }
  }

  /* =========================================================
   INIT
========================================================= */

  let bootScheduled = false;

  function scheduleBoot() {
    if (bootScheduled) {
      return;
    }

    bootScheduled = true;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bootScheduled = false;

        bootBossMedia();
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleBoot, {
      once: true,
    });
  } else {
    scheduleBoot();
  }

  window.Webflow = window.Webflow || [];

  window.Webflow.push(() => {
    scheduleBoot();

    safeRefresh();
  });

  window.addEventListener(
    'load',
    () => {
      scheduleBoot();

      safeRefresh();
    },
    {
      once: true,
    },
  );

  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      safeRefresh();
    } else {
      scheduleBoot();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      safeRefresh();
    }
  });
</script>
