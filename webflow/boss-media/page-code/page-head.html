<style>
  html.lenis, html.lenis body {
    height: auto;
    width: 100vw;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: hidden;
  }
  .lenis.lenis-smooth iframe {
    pointer-events: none;
  }
  
  /* --- ANTI JITTER UNTUK WEBFLOW INTERACTIONS --- */
  /* Memaksa elemen yang bergerak di Webflow agar dirender lebih mulus oleh GPU */
  [style*="will-change: transform"], 
  [style*="translate3d"] {
    -webkit-backface-visibility: hidden !important;
    backface-visibility: hidden !important;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    /* Menghaluskan render pixel di ujung animasi */
    image-rendering: -webkit-optimize-contrast; 
  }
</style>

<style>
  /* WRAPPER TEKS: Tugasnya hanya bergerak horizontal */

    display: flex;
    white-space: nowrap;
    width: max-content; /* Biarkan panjangnya selebar teks aslinya */

  /* TEKS: Tugasnya hanya untuk melengkung (skew) */

    display: inline-block;
    white-space: nowrap;

    transform-origin: center center;

    will-change: transform;

</style>

<style>
/* Container utama globe */
.globe-rotate {
  position: relative;
  overflow: visible !important;

  /* perspective: 1000px;
  -webkit-perspective: 1000px; */

  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;

  isolation: isolate;
}

/* Wrapper seluruh orbit */
.globe-rotate .orbit-wrapp {
  position: absolute;
  inset: 0;
  z-index: 2;

  overflow: visible !important;

  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

/* Semua garis orbit */
.globe-rotate .orbit-wrapp > div {
  position: absolute;

  transform-origin: 50% 50% !important;
  transform-style: preserve-3d !important;
  -webkit-transform-style: preserve-3d !important;

  backface-visibility: visible !important;
  -webkit-backface-visibility: visible !important;
}

/* Background globe berada di belakang orbit */
.globe-rotate .back-global {
  position: relative;
  display: block;
  width: 100%;
  height: auto;
  z-index: 1;
  pointer-events: none;

  backface-visibility: visible;
  -webkit-backface-visibility: visible;
}
</style>

<style>
  /* Pastikan dropdown menjadi reference position */
  .dropdown {
    position: relative;
  }

  /* Initial state */
  .dropdown-list {
    display: block !important;
    overflow: hidden;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transform: translateY(16px);
    clip-path: inset(100% 0 0 0);

    transition:
      clip-path 0.55s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.25s ease,
      visibility 0s linear 0.55s;

    will-change: clip-path, transform, opacity;
  }

  /* Dropdown open */
  .dropdown-list.w--open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;

    transform: translateY(0);
    clip-path: inset(0% 0 0 0);

    transition:
      clip-path 0.55s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.25s ease,
      visibility 0s;
  }

  /* Individual menu item initial state */
  .dropdown-list .drop-menu {
    opacity: 0;
    transform: translateY(18px);

    transition:
      transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
      opacity 0.3s ease;
  }

  /* Menu item reveal */
  .dropdown-list.w--open .drop-menu {
    opacity: 1;
    transform: translateY(0);
  }

  /* Stagger */
  .dropdown-list.w--open .drop-menu:nth-child(1) {
    transition-delay: 0.08s;
  }

  .dropdown-list.w--open .drop-menu:nth-child(2) {
    transition-delay: 0.12s;
  }

  .dropdown-list.w--open .drop-menu:nth-child(3) {
    transition-delay: 0.16s;
  }

  .dropdown-list.w--open .drop-menu:nth-child(4) {
    transition-delay: 0.2s;
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    .dropdown-list,
    .dropdown-list .drop-menu {
      transition: none;
      transform: none;
      clip-path: none;
    }
  }
  .checkbox {
  appearance: none;
  -webkit-appearance: none;

  width: 15px;
  height: 15px;
  margin: 0;

  background-color: #ffffff;
  border: 1px solid #000000;
  border-radius: 2px;

  display: grid;
  place-content: center;
  cursor: pointer;
}

/* Centang */
.checkbox::before {
  content: "";
  width: 5px;
  height: 5px;

  border-left: 2px solid #000000;
  border-bottom: 2px solid #000000;

  transform: rotate(-45deg) scale(0);
  transform-origin: center;
  transition: transform 0.2s ease;
}

/* Checked state */
.checkbox:checked::before {
  transform: rotate(-45deg) scale(1);
}

/* Focus keyboard */
.checkbox:focus-visible {
  outline: 2px solid #000000;
  outline-offset: 2px;
}
</style>

<style>

  .terminal-char {

  .terminal-text.is-typing::after {

<style>

<!-- Moved from the page footer (50000-char limit). Both run on
     Webflow.push = DOM ready, after the footer libraries, as before. -->
<script>
  window.Webflow = window.Webflow || [];

  window.Webflow.push(function () {
    const form = document.querySelector('#email-form');
    const submitButton = document.querySelector('.link-text.media');

    if (!form || !submitButton) return;

    submitButton.addEventListener('click', function (event) {
      event.preventDefault();

      // Menjalankan validasi required bawaan browser,
      // kemudian submit melalui sistem form Webflow.
      form.requestSubmit();
    });
  });
</script>

<script>
  window.Webflow = window.Webflow || [];

  window.Webflow.push(() => {
    const initFloatingCards = () => {
      if (typeof gsap === 'undefined') {
        setTimeout(initFloatingCards, 100);
        return;
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion) return;

      const mm = gsap.matchMedia();

      mm.add('(min-width: 992px)', () => {
        const cards = gsap.utils.toArray('.float-card');
        const animations = [];

        cards.forEach((card, index) => {
          let motionWrapper = card.querySelector(':scope > .float-card-motion');

          if (!motionWrapper) {
            const content = card.firstElementChild;

            if (!content) return;

            motionWrapper = document.createElement('div');
            motionWrapper.className = 'float-card-motion';

            Object.assign(motionWrapper.style, {
              width: '100%',
              height: '100%',
              display: 'block',
              willChange: 'transform',
              transformStyle: 'preserve-3d',
              backfaceVisibility: 'hidden',
            });

            card.insertBefore(motionWrapper, content);
            motionWrapper.appendChild(content);
          }

          const direction = index % 2 === 0 ? -1 : 1;

          gsap.set(motionWrapper, {
            x: direction * 2,
            y: direction * 4,
            rotationZ: direction * 0.3,
            force3D: true,
          });

          const animation = gsap.to(motionWrapper, {
            x: direction * 7,
            y: direction * 18,
            rotationZ: direction * 1,
            duration: 2.2 + index * 0.18,
            delay: index * 0.15,
            ease: 'sine.inOut',
            repeat: -1,
            yoyo: true,
            force3D: true,
          });

          animations.push({
            animation,
            motionWrapper,
          });
        });

        // Berjalan saat keluar dari desktop atau script dibersihkan
        return () => {
          animations.forEach(({ animation, motionWrapper }) => {
            animation.kill();

            gsap.set(motionWrapper, {
              clearProps: 'transform',
            });
          });
        };
      });
    };

    initFloatingCards();
  });
</script>
