    const isResponsive = window.matchMedia('(max-width: 991px)').matches;

    if (isResponsive) {
      const viewportWidth = document.documentElement.clientWidth || window.innerWidth;

      const viewportHeight = window.visualViewport?.height || window.innerHeight;

      return {
        width: Math.max(1, Math.round(viewportWidth)),

        height: Math.max(1, Math.round(viewportHeight)),
      };
    }

    const rect = container.getBoundingClientRect();

    return {
      width: Math.max(1, Math.round(rect.width || window.innerWidth)),

      height: Math.max(1, Math.round(rect.height || window.innerHeight)),
    };
  }

        symbol: table[i],

        col: table[i + 3],

        row: table[i + 4],
      });
    }

    return pts;
  }

  function getImageUrl(symbol) {
    return IMAGE_MAP[symbol] || '';
  }

  /* =========================================
     INIT
  ========================================= */

  init();
  animate();

  function init() {
    updateResponsiveConfig();

    const { width: initialWidth, height: initialHeight } = getRendererSize();

    /* =====================================
       CAMERA
    ===================================== */

    camera = new THREE.PerspectiveCamera(
      40,

      initialWidth / Math.max(1, initialHeight),

      1,

      12000,
    );

    camera.position.set(0, 0, cameraStartZ);

    /* =====================================
       SCENE
    ===================================== */

    scene = new THREE.Scene();

    const basePts = buildBasePoints();

    const baseCount = basePts.length;

    /* =====================================
       OBJECTS
    ===================================== */

    for (let idx = 0; idx < TARGET_COUNT; idx++) {
      const baseIndex = Math.floor(Math.random() * baseCount);

      const layer = Math.floor(idx / baseCount);

      const [oxN, oyN] = LAYER_OFFSETS[layer % LAYER_OFFSETS.length];

      const bp = basePts[baseIndex];

      const symbol = bp.symbol;

      /* =====================================
         DOM
      ===================================== */

      const element = document.createElement('div');

      element.className = 'element';

      element.style.width = `${CARD_W}px`;

      element.style.height = `${CARD_H}px`;

      const card = document.createElement('div');

      card.className = 'card';

      const img = document.createElement('img');

      img.src = getImageUrl(symbol);

      img.alt = symbol;

      img.draggable = false;

      card.appendChild(img);

      element.appendChild(card);

      img.onerror = () => {
        card.innerHTML = '';

        card.style.cssText += ';display:flex;' + 'align-items:center;' + 'justify-content:center;' + 'border:1px solid #ddd;';

        card.textContent = symbol;
      };

      const obj = new THREE.CSS3DObject(element);

      obj.element = element;

      /* =====================================
         END POSITION
      ===================================== */

      const sx = Math.random() * 4200 - 2100;

      const sy = Math.random() * 2600 - 1300;

      const szEnd = (Math.random() * 2 - 1) * END_Z_SPREAD;

      obj.position.set(
        sx,

        sy,

        END_Z_OFFSET + szEnd,
      );

      obj.rotation.set(
        (Math.random() - 0.5) * 0.7,

        (Math.random() - 0.5) * 0.7,

        (Math.random() - 0.5) * 0.25,
      );

      scene.add(obj);

      objects.push(obj);

      /* =====================================
         START POSITION
      ===================================== */

      const tx = bp.col * GRID_X;

      const ty = -(bp.row * GRID_Y);

      const tx2 = tx + oxN * LAYER_OX;

      const ty2 = ty + oyN * LAYER_OY;

      const jitterX = signedBiasedRandom() * JITTER_X_AMOUNT;

      const jitterY = signedBiasedRandom() * JITTER_Y_AMOUNT;

      const szStart = (Math.random() * 2 - 1) * START_Z_SPREAD;

      const startTarget = new THREE.Object3D();

      startTarget.position.set(
        tx2 + jitterX,

        ty2 + jitterY,

        START_Z_OFFSET + szStart,
      );

      startTarget.rotation.set(
        (Math.random() - 0.5) * START_ROT_MAX * 0.5,

        (Math.random() - 0.5) * START_ROT_MAX * 0.5,

        (Math.random() - 0.5) * START_ROT_MAX,
      );

      startTarget.updateMatrixWorld(true);

      startKF.push({
        pos: startTarget.position.clone(),

        quat: startTarget.quaternion.clone(),
      });

      endKF.push({
        pos: obj.position.clone(),

        quat: obj.quaternion.clone(),
      });

      obj.position.copy(startKF[startKF.length - 1].pos);

      obj.quaternion.copy(startKF[startKF.length - 1].quat);

      zStartSpreads.push(szStart);

      zEndSpreads.push(szEnd);

      const cardScale = lerp(SCALE_MIN, SCALE_MAX, Math.random());

      perCardScales.push(cardScale);

      /*
        Correct responsive scale
        langsung dari initial frame.
      */

      obj.scale.setScalar(cardScale * globalStartSc);

      cardEls.push(card);
    }

    /* =====================================
       CENTER START FORMATION
    ===================================== */

    centerStartTargets();

    const center = computeCenter(startKF.map((k) => k.pos));

    const dists = startKF.map((k) => k.pos.distanceTo(center));

    const maxDist = Math.max(...dists) || 1;

    for (let i = 0; i < objects.length; i++) {
      const norm = dists[i] / maxDist;

      const wave = norm * 0.28;

      const jitter = (Math.random() - 0.5) * 0.03;

      delays.push(clamp01(wave + jitter));
    }

    /* =====================================
       CENTER FOCUS
    ===================================== */

    centerFocusIndex = objects.reduce(
      (bestIndex, _, index) => {
        const startRadius = Math.hypot(
          startKF[index].pos.x,

          startKF[index].pos.y,
        );

        const bestStartRadius = Math.hypot(
          startKF[bestIndex].pos.x,

          startKF[bestIndex].pos.y,
        );

        const score = zEndSpreads[index] + startRadius * 0.22 + delays[index] * 120;

        const bestScore = zEndSpreads[bestIndex] + bestStartRadius * 0.22 + delays[bestIndex] * 120;

        return score < bestScore ? index : bestIndex;
      },

      0,
    );

    objects[centerFocusIndex].element.classList.add('is-center-focus');

    /* =====================================
       RENDERER
    ===================================== */

    renderer = new THREE.CSS3DRenderer();

    renderer.setSize(initialWidth, initialHeight);

    Object.assign(
      renderer.domElement.style,

      {
        position: 'absolute',

        top: '0',

        left: '0',

        width: `${initialWidth}px`,

        height: `${initialHeight}px`,

        overflow: 'hidden',
      },
    );

    container.appendChild(renderer.domElement);

    /* =====================================
       RESIZE OBSERVER
    ===================================== */

    const resizeObserver = new ResizeObserver(requestResize);

    resizeObserver.observe(container);

    /* =====================================
       EVENTS
    ===================================== */

    window.addEventListener(
      'resize',

      requestResize,

      {
        passive: true,
      },
    );

    window.addEventListener(
      'orientationchange',

      () => {
        requestResize();

        setTimeout(requestResize, 100);

        setTimeout(requestResize, 300);
      },

      {
        passive: true,
      },
    );

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        'resize',

        requestResize,

        {
          passive: true,
        },
      );
    }

    window.addEventListener(
      'scroll',

      onScroll,

      {
        passive: true,
      },
    );

    window.addEventListener(
      'load',

      requestResize,

      {
        once: true,
      },
    );

    window.addEventListener(
      'pageshow',

      requestResize,
    );

    window.addEventListener(
      'mousemove',

      (e) => {
        mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;

        mouseTarget.y = -((e.clientY / window.innerHeight) * 2 - 1);
      },

      {
        passive: true,
      },
    );

    /* =====================================
       WEBFLOW INITIAL RESIZE FIX
    ===================================== */

    requestAnimationFrame(() => {
      onResize();

      requestAnimationFrame(onResize);
    });

    setTimeout(onResize, 100);

    setTimeout(onResize, 300);

    setTimeout(onResize, 700);

    onScroll();
    render();
  }

  /* =========================================
     RAF RESIZE
  ========================================= */

  let resizeRaf = null;

  function requestResize() {
    if (resizeRaf) {
      cancelAnimationFrame(resizeRaf);
    }

    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;

      onResize();
    });
  }

  /* =========================================
     RANDOM
  ========================================= */

  function signedBiasedRandom() {
    const sign = Math.random() < 0.5 ? -1 : 1;

    return sign * Math.pow(Math.random(), 0.55);
  }

  /* =========================================
     CENTER START TARGETS
  ========================================= */

  function centerStartTargets() {
    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;

    for (const k of startKF) {
      minX = Math.min(minX, k.pos.x);

      maxX = Math.max(maxX, k.pos.x);

      minY = Math.min(minY, k.pos.y);

      maxY = Math.max(maxY, k.pos.y);
    }

    const cx = (minX + maxX) / 2;

    const cy = (minY + maxY) / 2;

    for (const k of startKF) {
      k.pos.x -= cx;

      k.pos.y -= cy;
    }
  }

  /* =========================================
     SCROLL
  ========================================= */

  /* =========================================
     HERO FADE (sinkron langsung dgn scroll)
  ========================================= */

  function updateHeroFade() {
    const pinEl = collageTrack || logoSection;

    if (!pinEl || !heroContent || !heroTrack) {
      heroHoldPx = 0;

      return;
    }

    const viewportHeight = window.innerHeight;

    const y = window.scrollY;

    const heroRect = heroTrack.getBoundingClientRect();

    const heroTop = heroRect.top + y;

    const heroRun = heroRect.height + viewportHeight;

    /* progress hero ala IX2 "scrolling in view" */
    const heroP = (y - (heroTop - viewportHeight)) / Math.max(1, heroRun);

    /* ----- heading merapat ----- */

    const headingT = clamp01((heroP - HERO_HEADING_FROM) / (HERO_HEADING_TO - HERO_HEADING_FROM));

    const headingWidth = Math.round(lerp(HERO_HEADING_W_START, HERO_HEADING_W_END, headingT) * 100) / 100;

    if (headingWidth !== lastHeadingWidth) {
      lastHeadingWidth = headingWidth;

      document.documentElement.style.setProperty('--boss-hero-heading-w', `${headingWidth}vw`);
    }

    /* ----- fade setelah heading selesai ----- */

    const headingEndY = heroTop - viewportHeight + HERO_HEADING_TO * heroRun;

    /* #container pin saat track ini sampai top */
    const pinY = pinEl.getBoundingClientRect().top + y;

    /* mulai setelah heading selesai DAN logo
       sudah diam di tengah (pin) */
    const fadeStart = Math.max(headingEndY + viewportHeight * HERO_FADE_GAP, pinY);

    const fadeEnd = fadeStart + viewportHeight * HERO_FADE_LENGTH;

    heroHoldPx = Math.max(0, fadeEnd - pinY);

    const t = clamp01((y - fadeStart) / Math.max(1, fadeEnd - fadeStart));

    const opacity = Math.round((1 - smoothstep(t)) * 1000) / 1000;

    if (opacity === lastHeroOpacity) {
      return;
    }

    lastHeroOpacity = opacity;

    document.documentElement.style.setProperty('--boss-hero-opacity', String(opacity));

    heroContent.style.visibility = opacity <= 0 ? 'hidden' : '';
  }

  function onScroll() {
    const section = logoSection;

    if (!section) {
      scrollP = 0;

      return;
    }

    const viewportHeight = window.innerHeight;

    /* =====================================
       TABLET + MOBILE
       Margin negatif Webflow bikin tinggi
       .section-boss-logo tidak sama dengan
       runway sticky. Pakai jarak nyata:
       pin -> section berikut muncul.
    ===================================== */

    if (responsiveMQ.matches && collageTrack && nextSection) {
      const trackRect = collageTrack.getBoundingClientRect();

      const nextTop = nextSection.getBoundingClientRect().top;

      const visibleRun = Math.max(
        viewportHeight * 0.5,

        nextTop - trackRect.top - viewportHeight * NEXT_SECTION_OFFSET,
      );

      const runAfterHero = Math.max(viewportHeight * 0.5, visibleRun - heroHoldPx);

      scrollP = clamp01((-trackRect.top - heroHoldPx) / (runAfterHero * ANIMATION_END_AT_RESPONSIVE));

      return;
    }

    const rect = section.getBoundingClientRect();

    const fullScrollDistance = Math.max(
      1,

      rect.height - viewportHeight,
    );

    const animationDistance = Math.max(viewportHeight * 0.5, fullScrollDistance * ANIMATION_END_AT - heroHoldPx);

    /* logo baru jalan setelah hero hilang */
    scrollP = clamp01((-rect.top - heroHoldPx) / animationDistance);
  }

  /* =========================================
     ANIMATION LOOP
  ========================================= */

  function animate() {
    requestAnimationFrame(animate);

    mouse.x += (mouseTarget.x - mouse.x) * 0.08;

    mouse.y += (mouseTarget.y - mouse.y) * 0.08;

    /* baca posisi tiap frame: tidak tergantung
       event scroll yang bisa telat */
    updateHeroFade();

    onScroll();

    scrollPSmooth += (scrollP - scrollPSmooth) * SCROLL_SMOOTH;

    if (Math.abs(scrollP - scrollPSmooth) < 0.0005) {
      scrollPSmooth = scrollP;
    }

    updateByScroll();
  }

  /* =========================================
     UPDATE
  ========================================= */

  function updateByScroll() {
    const pBase = scrollPSmooth;

    updateCamera(pBase);

    const maxZExtent =
      Math.max(
        Math.abs(START_Z_OFFSET) + START_Z_SPREAD * Math.max(1, zStartMult),

        Math.abs(END_Z_OFFSET) + END_Z_SPREAD * Math.max(1, zEndMult),
      ) * 1.1 || 1;

    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];

      const d = delays[i];

      const lp = clamp01((pBase - d) / (1 - d));

      const eased = smoothstep(lp);

      const magnet = 1 - Math.pow(1 - eased, 3);

      const lockMix = clamp01((lp - 0.72) / 0.28);

      const p = lerp(
        eased,

        magnet,

        lockMix,
      );

      /* =====================================
         BASE POSITION
      ===================================== */

      o.position.lerpVectors(
        startKF[i].pos,

        endKF[i].pos,

        p,
      );

      /* =====================================
         RESPONSIVE UNIFORM FIT
      =====================================

         X dan Y memakai angka SAMA.

         Jadi formasi tetap proporsional,
         tidak gepeng horizontal.
      ===================================== */

      o.position.x *= sceneScale;

      o.position.y *= sceneScale;

      /* =====================================
         ROTATION
      ===================================== */

      o.quaternion.copy(startKF[i].quat).slerp(endKF[i].quat, p);

      /* =====================================
         CENTER LOCK
      ===================================== */

      const centerLock = i === centerFocusIndex ? smoothstep(clamp01((pBase - 0.34) / 0.2)) : 0;

      /* =====================================
         Z DEPTH
      ===================================== */

      const dynStartZ = START_Z_OFFSET + zStartSpreads[i] * zStartMult;

      const dynEndZ = END_Z_OFFSET + zEndSpreads[i] * zEndMult;

      o.position.z = lerp(
        dynStartZ,

        dynEndZ,

        p,
      );

      const depthNorm = clamp01(Math.abs(dynEndZ) / (END_Z_SPREAD * Math.max(1, zEndMult) + 1));

      /* =====================================
         PARALLAX
      ===================================== */

      const parAmp =
        80 *
        lerp(
          1,

          0.35,

          depthNorm,
        ) *
        sceneParallax;

      const parallaxMix = i === centerFocusIndex ? 1 - centerLock : 1;

      o.position.x += mouse.x * parAmp * parallaxMix;

      o.position.y += mouse.y * parAmp * parallaxMix;

      /* =====================================
         CARD SCALE
      ===================================== */

      const scaledStart = perCardScales[i] * globalStartSc;

      const scaledEnd = perCardScales[i] * globalEndSc;

      o.scale.setScalar(
        lerp(
          scaledStart,

          scaledEnd,

          p,
        ),
      );

      /* =====================================
         Z NORMAL
      ===================================== */

      const zNorm = clamp01((o.position.z + maxZExtent) / (maxZExtent * 2));

      /* =====================================
         HIDE END
      ===================================== */

      const HIDE_START = 0.95;

      const hideT = clamp01((pBase - HIDE_START) / (1 - HIDE_START));

      const sweep = smoothstep(hideT);

      const SAFE_BEHIND = 900;

      const minBehindZ = camera.position.z + SAFE_BEHIND;

      o.position.z =
        Math.max(
          o.position.z,

          minBehindZ,
        ) *
          sweep +
        o.position.z * (1 - sweep);

      /* =====================================
         CENTER FOCUS
      ===================================== */

      if (i === centerFocusIndex) {
        camera.getWorldDirection(focusCameraDirection);

        const directionZ = Math.abs(focusCameraDirection.z) > 0.00001 ? focusCameraDirection.z : -0.00001;

        const rayDistance = (o.position.z - camera.position.z) / directionZ;

        const screenCenterX = camera.position.x + focusCameraDirection.x * rayDistance;

        const screenCenterY = camera.position.y + focusCameraDirection.y * rayDistance;

        o.position.x = lerp(
          o.position.x,

          screenCenterX,

          centerLock,
        );

        o.position.y = lerp(
          o.position.y,

          screenCenterY,

          centerLock,
        );
      }

      /* =====================================
         FADE OUT BERURUTAN
      ===================================== */

      const fadeStart = i === centerFocusIndex ? CENTER_FADE_START : OTHERS_FADE_START;

      const fadeEnd = i === centerFocusIndex ? CENTER_FADE_END : OTHERS_FADE_END;

      const fade = Math.round((1 - smoothstep(clamp01((pBase - fadeStart) / (fadeEnd - fadeStart)))) * 1000) / 1000;

      if (cardFades[i] !== fade) {
        cardFades[i] = fade;

        o.element.style.opacity = String(fade);

        o.element.style.visibility = fade <= 0 ? 'hidden' : '';
      }

      /* =====================================
         SHADOW
      ===================================== */

      const shadowSize = shadowStr * 28 * zNorm;

      const shadowOpacity = shadowStr * 0.65 * zNorm;

      cardEls[i].style.boxShadow = shadowStr > 0.005 ? `0 ${shadowSize * 0.5}px ${shadowSize}px rgba(0,0,0,${shadowOpacity.toFixed(3)})` : 'none';

      const brightness =
        shadowDarken > 0.005
          ? lerp(
              1 - shadowDarken * 0.72,

              1,

              zNorm,
            )
          : 1;

      cardEls[i].style.filter = brightness < 0.999 ? `brightness(${brightness.toFixed(3)})` : '';
    }

    updateNextReveal(pBase);

    render();
  }



  function updateNextReveal(p) {
    const opacity = Math.round(smoothstep(clamp01((p - NEXT_REVEAL_START) / (NEXT_REVEAL_END - NEXT_REVEAL_START))) * 1000) / 1000;

    if (opacity === lastNextOpacity) {
      return;
    }

    lastNextOpacity = opacity;

    document.documentElement.style.setProperty('--boss-next-opacity', String(opacity));
  }

  /* =========================================
     CAMERA
  ========================================= */

  function updateCamera(p) {
    const pe = smoothstep(p);

    const deep = easeInCubic(clamp01((p - 0.55) / 0.45));

    camera.position.z = lerp(
      cameraStartZ,

      cameraEndZ,

      deep,
    );

    camera.position.x = lerp(
      cameraStartX,

      0,

      pe,
    );

    camera.position.y = lerp(
      cameraStartY,

      0,

      pe,
    );

    camera.lookAt(0, 0, 0);
  }


  function onResize() {
    if (!camera || !renderer || !container) {
      return;
    }

    updateResponsiveConfig();

    const { width, height } = getRendererSize();

    camera.aspect = width / Math.max(1, height);

    camera.updateProjectionMatrix();

    renderer.setSize(width, height, false);

    renderer.domElement.style.width = `${width}px`;

    renderer.domElement.style.height = `${height}px`;

    renderer.domElement.style.left = '0px';

    renderer.domElement.style.top = '0px';

    onScroll();

    render();
  }

  /* =========================================
     RENDER
  ========================================= */

  function render() {
    renderer.render(scene, camera);
  }

  /* =========================================
     HELPERS
  ========================================= */

  function clamp01(x) {
    return Math.min(
      1,

      Math.max(0, x),
    );
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(t) {
    return t * t * (3 - 2 * t);
  }

  function easeInCubic(t) {
    return t * t * t;
  }

  function computeCenter(vecs) {
    const c = new THREE.Vector3();

    for (const v of vecs) {
      c.add(v);
    }

    c.multiplyScalar(1 / Math.max(1, vecs.length));

    return c;
  }
</script>

<script>
  const lenis2 = new Lenis({
    lerp: 0.035,
    wheelMultiplier: 0.25,
    smoothWheel: true,
    direction: 'vertical',
    gestureDirection: 'vertical',
    smoothTouch: false,
    touchMultiplier: 1,
    infinite: false,
  });

  if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
    lenis2.on('scroll', ScrollTrigger.update);

    gsap.ticker.add((time) => {
      lenis2.raf(time * 1000);
    });

    gsap.ticker.lagSmoothing(0);
  } else {
    function raf2(time) {
      lenis2.raf(time);
      requestAnimationFrame(raf2);
    }
    requestAnimationFrame(raf2);
  }

  /* DIHAPUS: dispatch 'scroll' manual bikin loop
     (Lenis dengar event scroll -> emit lagi ->
     "Maximum call stack size exceeded").
     window.scrollTo dari Lenis sudah memicu
     event scroll native. */

  let isMenuOpen = false;
  document.querySelectorAll('.menu-button-class-kamu').forEach((btn) => {
    btn.addEventListener('click', () => {
      isMenuOpen = !isMenuOpen;
      if (isMenuOpen) {
        lenis2.stop();
      } else {
        lenis2.start();
      }
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    gsap.registerPlugin(ScrollTrigger);

    const textWrapper = document.querySelector('.all-reach-big-font');
    const textElement = document.querySelector('.all-reach-big-font h2');

    if (!textWrapper || !textElement) return;

    gsap.set(textWrapper, { clearProps: 'all' });

    gsap.fromTo(
      textWrapper,
      {
        x: '100vw',
        xPercent: 0,
      },
      {
        x: '-10vw',
        xPercent: -100,
        ease: 'none',
        scrollTrigger: {
          trigger: '.all-reach-track-contanier',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 1,
        },
      },
    );

    let proxy = { skew: 0 };
    let skewSetter = gsap.quickSetter(textElement, 'skewX', 'deg');
    let clamp = gsap.utils.clamp(-15, 15);

    ScrollTrigger.create({
      trigger: '.all-reach-track-contanier',
      start: 'top bottom',
      end: 'bottom top',
      onUpdate: (self) => {
        let skew = clamp(self.getVelocity() / -150);

        if (Math.abs(skew) > Math.abs(proxy.skew)) {
          proxy.skew = skew;
          gsap.to(proxy, {
            skew: 0,
            duration: 0.8,
            ease: 'power3.out',
            overwrite: true,
            onUpdate: () => skewSetter(proxy.skew),
          });
        }
      },
    });
  });
</script>

<script>
  window.Webflow = window.Webflow || [];

  window.Webflow.push(() => {
    const initFloatingCards = () => {
      if (typeof gsap === 'undefined') {
        setTimeout(initFloatingCards, 100);
        return;
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduceMotion) return;

      const mm = gsap.matchMedia();

      mm.add('(min-width: 992px)', () => {
        const cards = gsap.utils.toArray('.float-card');
        const animations = [];

        cards.forEach((card, index) => {
          let motionWrapper = card.querySelector(':scope > .float-card-motion');

          if (!motionWrapper) {
            const content = card.firstElementChild;

            if (!content) return;

            motionWrapper = document.createElement('div');
            motionWrapper.className = 'float-card-motion';

            Object.assign(motionWrapper.style, {
              width: '100%',
              height: '100%',
              display: 'block',
              willChange: 'transform',
              transformStyle: 'preserve-3d',
              backfaceVisibility: 'hidden',
            });

            card.insertBefore(motionWrapper, content);
            motionWrapper.appendChild(content);
          }

          const direction = index % 2 === 0 ? -1 : 1;

          gsap.set(motionWrapper, {
            x: direction * 2,
            y: direction * 4,
            rotationZ: direction * 0.3,
            force3D: true,
          });

          const animation = gsap.to(motionWrapper, {
            x: direction * 7,
            y: direction * 18,
            rotationZ: direction * 1,
            duration: 2.2 + index * 0.18,
            delay: index * 0.15,
            ease: 'sine.inOut',
            repeat: -1,
            yoyo: true,
            force3D: true,
          });

          animations.push({
            animation,
            motionWrapper,
          });
        });

        // Berjalan saat keluar dari desktop atau script dibersihkan
        return () => {
          animations.forEach(({ animation, motionWrapper }) => {
            animation.kill();

            gsap.set(motionWrapper, {
              clearProps: 'transform',
            });
          });
        };
      });
    };

    initFloatingCards();
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    gsap.registerPlugin(ScrollTrigger, SplitText);

    // Tunggu font selesai supaya pembagian line akurat
    if (document.fonts?.ready) {
      await document.fonts.ready;
    }

    const mm = gsap.matchMedia();

    /* =========================================================
       MOBILE ONLY — 991px KE BAWAH
    ========================================================= */

    mm.add('(max-width: 991px)', () => {
      const targets = document.querySelectorAll(
        '[anim-reveal="scroll"]'
      );

      const items = [];
      const splits = [];

      targets.forEach((element) => {


        const split = new SplitText(element, {
          type: 'lines',
          linesClass: 'anim-reveal-line',
        });

        splits.push(split);

        const lines = split.lines;


        gsap.set(element, {
          visibility: 'visible',
        });

        gsap.set(lines, {
          yPercent: 60,
          opacity: 0,
          filter: 'blur(10px)',
        });

        const item = {
          element,
          lines,
          visible: false,
        };

        item.reveal = () => {
          if (item.visible) return;

          item.visible = true;

          gsap.killTweensOf(lines);

          gsap.fromTo(
            lines,
            {
              yPercent: 60,
              opacity: 0,
              filter: 'blur(10px)',
            },
            {
              yPercent: 0,
              opacity: 1,
              filter: 'blur(0px)',
              duration: 1.1,
              ease: 'power3.out',
              stagger: {
                each: 0.12,
                from: 'start',
              },
              overwrite: true,
            }
          );
        };


        item.hide = () => {
          if (!item.visible) return;

          item.visible = false;

          gsap.killTweensOf(lines);

          gsap.to(lines, {
            yPercent: 30,
            opacity: 0,
            filter: 'blur(10px)',
            duration: 0.5,
            ease: 'power2.inOut',
            stagger: {
              each: 0.05,
              from: 'start',
            },
            overwrite: true,
          });
        };

        items.push(item);
      });

      function updateReveal() {
        const viewportHeight = window.innerHeight;


        const revealPoint = viewportHeight * 0.85;

        items.forEach((item) => {
          const rect =
            item.element.getBoundingClientRect();

          const isOnScreen =
            rect.bottom > 0 &&
            rect.top < viewportHeight;

          const reachedRevealPoint =
            rect.top <= revealPoint;

          const fullyAbove =
            rect.bottom <= 0;

          const fullyBelow =
            rect.top >= viewportHeight;


          if (
            isOnScreen &&
            reachedRevealPoint
          ) {
            item.reveal();
          }


          if (
            fullyAbove ||
            fullyBelow
          ) {
            item.hide();
          }
        });
      }


      const trigger = ScrollTrigger.create({
        start: 0,
        end: 'max',

        onUpdate: updateReveal,
        onRefresh: updateReveal,
      });


      window.addEventListener(
        'resize',
        updateReveal
      );


      updateReveal();

      ScrollTrigger.refresh();


      return () => {
        window.removeEventListener(
          'resize',
          updateReveal
        );

        trigger.kill();

        items.forEach((item) => {
          gsap.killTweensOf(item.lines);
        });

        splits.forEach((split) => {
          split.revert();
        });

        targets.forEach((element) => {
          gsap.set(element, {
            clearProps: 'visibility',
          });
        });

        ScrollTrigger.refresh();
      };
    });
  });
</script>
