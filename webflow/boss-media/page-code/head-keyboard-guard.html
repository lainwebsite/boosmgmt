<script>
  /* =========================================================
     MOBILE KEYBOARD GUARD  (registered script bosskeyboardguard)

     Most sections here are sized in vh (500vh, 350vh, 1050vh...)
     and wrapped in sticky / transformed layers. The browser's own
     "scroll the focused field into view" miscalculates on this
     layout and throws the page far down (iPhone: to the footer).
  ========================================================= */

  (() => {
    /* 1. Keyboard overlays the page instead of resizing it
          (Chrome / Samsung Internet / Firefox Android). */
    const meta = document.querySelector('meta[name="viewport"]');

    if (meta && !/interactive-widget/.test(meta.content)) {
      meta.setAttribute('content', `${meta.content}, interactive-widget=resizes-visual`);
    }

    if (!matchMedia('(pointer: coarse)').matches) {
      return;
    }

    const FIELDS =
      'input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="hidden"]), textarea, select, [contenteditable="true"]';

    const TYPING = 'input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="hidden"]), textarea';

    const isField = (el) => !!el && !!el.matches && el.matches(FIELDS);

    /* 2. Tap on a text field: focus it ourselves with preventScroll,
          so the browser does not jump the page. The keyboard still
          opens (focus runs inside the tap) and the browser only pans
          the visual viewport to show the caret. */
    let tap = null;

    document.addEventListener(
      'touchstart',
      (event) => {
        const field = event.target.closest?.(TYPING);

        tap = field && field !== document.activeElement ? { field, x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
      },
      {
        passive: true,
      },
    );

    document.addEventListener(
      'touchend',
      (event) => {
        if (!tap) {
          return;
        }

        const { field, x, y } = tap;

        tap = null;

        const touch = event.changedTouches[0];

        /* A swipe that started on a field is a scroll, not a tap */
        if (!touch || Math.abs(touch.clientX - x) > 10 || Math.abs(touch.clientY - y) > 10) {
          return;
        }

        event.preventDefault();

        field.focus({
          preventScroll: true,
        });
      },
      {
        passive: false,
      },
    );

    /* 3. Browsers that still resize the layout (in-app webviews...):
          when the keyboard closes, put the form back where it was.
          Skipped when the layout never resized (iOS). */
    let session = null;

    document.addEventListener('focusin', (event) => {
      if (session || !isField(event.target)) {
        return;
      }

      const anchor = event.target.closest('form') || event.target;

      session = {
        anchor,
        top: anchor.getBoundingClientRect().top,
        height: window.innerHeight,
        resized: false,
      };
    });

    window.addEventListener(
      'resize',
      () => {
        if (session && Math.abs(window.innerHeight - session.height) > 80) {
          session.resized = true;
        }
      },
      {
        passive: true,
      },
    );

    document.addEventListener('focusout', () => {
      setTimeout(() => {
        /* Moving to the next field keeps the keyboard open */
        if (!session || isField(document.activeElement)) {
          return;
        }

        const { anchor, top, resized } = session;

        session = null;

        if (!resized) {
          return;
        }

        const started = performance.now();

        let lastKey = '';

        let stableSince = started;

        const settle = (now) => {
          const key = `${window.innerHeight}|${window.visualViewport ? Math.round(window.visualViewport.height) : 0}`;

          if (key !== lastKey) {
            lastKey = key;

            stableSince = now;
          }

          /* Wait until the keyboard has finished closing */
          if (now - stableSince < 180 && now - started < 1200) {
            requestAnimationFrame(settle);

            return;
          }

          if (isField(document.activeElement)) {
            return;
          }

          const delta = anchor.getBoundingClientRect().top - top;

          if (Math.abs(delta) > 2) {
            window.scrollTo(0, window.scrollY + delta);
          }
        };

        requestAnimationFrame(settle);
      }, 120);
    });

    /* 4. ScrollTrigger must not re-measure on keyboard resize */
    window.addEventListener(
      'load',
      () => {
        try {
          window.ScrollTrigger?.config?.({
            ignoreMobileResize: true,
          });
        } catch (_) {}
      },
      {
        once: true,
      },
    );
  })();
</script>
