<script>
  /* =========================================================
     MOBILE KEYBOARD GUARD  (registered script bosskeyboardguard)

     Measured on iPhone Chrome (?kbdebug): opening the keyboard
     shrinks the layout viewport (innerHeight 666 -> 337), so every
     vh-sized section shrinks with it and the document drops from
     12493px to 7846px. That collapse is the jump.

     Fix: when a field gets focus (before the keyboard opens) pin
     every large block to its current px size; release it once the
     keyboard has closed and the viewport is back to its height.
  ========================================================= */

  (() => {
    /* Keyboard overlays instead of resizing (Chromium / Firefox) */
    const meta = document.querySelector('meta[name="viewport"]');

    if (meta && !/interactive-widget/.test(meta.content)) {
      meta.setAttribute('content', `${meta.content}, interactive-widget=resizes-visual`);
    }

    if (!matchMedia('(pointer: coarse)').matches) {
      return;
    }

    const FIELDS =
      'input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="hidden"]), textarea, select, [contenteditable="true"]';

    const isField = (el) => !!el && !!el.matches && el.matches(FIELDS);

    const PROPS = ['height', 'min-height', 'max-height', 'margin-top', 'margin-bottom', 'padding-top', 'padding-bottom'];

    let frozen = null;

    let baseHeight = 0;

    let baseWidth = 0;

    const freeze = () => {
      if (frozen) {
        return;
      }

      baseHeight = window.innerHeight;

      baseWidth = window.innerWidth;

      /* vh-driven blocks are big: >= 25vh of height, margin or padding */
      const big = baseHeight * 0.25;

      const list = [];

      /* Read everything first, then write, to avoid layout thrash */
      for (const el of document.body.querySelectorAll('*')) {
        const cs = getComputedStyle(el);

        if (cs.display === 'none' || cs.display === 'inline' || cs.display === 'contents' || cs.position === 'fixed') {
          continue;
        }

        const height = parseFloat(cs.height);

        const edges = [cs.marginTop, cs.marginBottom, cs.paddingTop, cs.paddingBottom].map((v) => Math.abs(parseFloat(v) || 0));

        if (!(height >= big || edges.some((v) => v >= big))) {
          continue;
        }

        list.push([
          el,
          PROPS.map((p) => [p, el.style.getPropertyValue(p), el.style.getPropertyPriority(p)]),
          [cs.height, cs.height, 'none', cs.marginTop, cs.marginBottom, cs.paddingTop, cs.paddingBottom],
        ]);
      }

      for (const [el, , values] of list) {
        PROPS.forEach((p, i) => el.style.setProperty(p, values[i], 'important'));
      }

      frozen = list;
    };

    const unfreeze = () => {
      if (!frozen) {
        return;
      }

      for (const [el, saved] of frozen) {
        for (const [p, value, priority] of saved) {
          if (value) {
            el.style.setProperty(p, value, priority);
          } else {
            el.style.removeProperty(p);
          }
        }
      }

      frozen = null;
    };

    document.addEventListener('focusin', (event) => {
      if (isField(event.target)) {
        freeze();
      }
    });

    document.addEventListener('focusout', () => {
      setTimeout(() => {
        /* Moving to the next field keeps the keyboard open */
        if (!frozen || isField(document.activeElement)) {
          return;
        }

        const started = performance.now();

        /* Release once the viewport is back to full height */
        const wait = (now) => {
          if (isField(document.activeElement)) {
            return;
          }

          if (window.innerHeight >= baseHeight - 10 || now - started > 1500) {
            unfreeze();

            return;
          }

          requestAnimationFrame(wait);
        };

        requestAnimationFrame(wait);
      }, 150);
    });

    /* Real rotation changes the width; the keyboard only the height.
       (orientationchange also fires when the keyboard makes the
       viewport wider than tall, so it cannot be trusted here.) */
    window.addEventListener('resize', () => {
      if (frozen && Math.abs(window.innerWidth - baseWidth) > 40) {
        unfreeze();
      }
    });

    /* ScrollTrigger must not re-measure on keyboard resize */
    window.addEventListener(
      'load',
      () => {
        try {
          window.ScrollTrigger?.config?.({
            ignoreMobileResize: true,
          });
        } catch (_) {}
      },
      {
        once: true,
      },
    );
  })();
</script>
